[project]
name = "flyover-scrub"
version = "0.1.0"
description = "Remove aircraft Doppler signatures from audio so recordings cannot be geolocated from flyovers"
readme = "README.md"
authors = [
    { name = "lizTheDeveloper", email = "lizthedeveloper@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.7",
    "imageio-ffmpeg>=0.5",
]

[project.gui-scripts]
flyover-scrub-gui = "flyover_scrub.gui:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
flyover-scrub = "flyover_scrub.cli:main"
flyover-capture = "flyover_scrub.adsb:main"
flyover-audit = "flyover_scrub.audit:main"

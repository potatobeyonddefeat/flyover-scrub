name: Build desktop app

# Builds the drag-and-drop app for Windows and macOS.
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to also publish a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv sync --extra gui
          uv pip install pyinstaller
      - name: Test
        run: uv run --extra gui pytest -q
      - name: Build
        run: uv run --extra gui python packaging/build.py
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/flyover-scrub -DestinationPath flyover-scrub-${{ matrix.name }}.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/flyover-scrub.app flyover-scrub-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: flyover-scrub-${{ matrix.name }}
          path: flyover-scrub-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --generate-notes
